<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>convertcase</title>
    <style>
        :root {
            --bg-color: #0a0a0a;
            --container-bg: #121212;
            --text-color: #b0b0b0;
            --border-color: #222;
            --accent-color: #8a2be2;
            --input-bg: #0e0e0e;
        }

        body {
            font-family: 'Consolas', 'Monaco', 'Segoe UI', monospace;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            padding: 20px;
            margin: 0;
        }

        .container {
            width: 100%;
            max-width: 1000px;
            background: var(--container-bg);
            padding: 1.5rem;
            border-radius: 4px;
            border: 1px solid var(--border-color);
            position: relative;
        }

        .new-tab-btn {
            position: absolute;
            top: 10px;
            left: 10px;
            padding: 4px 8px;
            font-size: 10px;
            background: transparent;
            border: 1px solid var(--border-color);
            color: #444;
            cursor: pointer;
            text-transform: uppercase;
        }
        
        .new-tab-btn:hover {
            color: var(--accent-color);
            border-color: var(--accent-color);
        }

        .expand-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            padding: 4px 8px;
            font-size: 10px;
            background: transparent;
            border: 1px solid var(--border-color);
            color: #444;
            cursor: pointer;
            text-transform: uppercase;
        }

        .expand-btn:hover {
            color: var(--accent-color);
            border-color: var(--accent-color);
        }

        /* Editor container replacing standard textarea */
        .editor {
            width: 100%;
            height: 450px;
            padding: 20px;
            background-color: var(--input-bg);
            color: #dcdcdc;
            border: 1px solid var(--border-color);
            border-radius: 2px;
            font-size: 16px;
            line-height: 1.2;
            box-sizing: border-box;
            margin-top: 15px;
            margin-bottom: 1.2rem;
            outline: none;
            overflow-y: auto;
            white-space: pre-wrap;
            word-wrap: break-word;
            font-family: inherit;
            transition: border-color 0.2s, height 0.2s;
        }

        .editor:focus { border-color: #444; }

        /* Styling for empty editor placeholder */
        .editor[data-placeholder]:empty:before {
            content: attr(data-placeholder);
            color: #555;
        }

        .controls {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 8px;
            margin-bottom: 1rem;
        }

        button {
            padding: 10px;
            cursor: pointer;
            background-color: #1a1a1a;
            color: var(--text-color);
            border: 1px solid var(--border-color);
            border-radius: 2px;
            font-size: 12px;
            letter-spacing: 1px;
            transition: all 0.15s;
        }

        button:hover {
            background-color: var(--accent-color);
            color: #fff;
            border-color: var(--accent-color);
        }

        .case-btn-lower { text-transform: lowercase; }
        .case-btn-upper { text-transform: uppercase; }

        .action-btns {
            display: flex;
            gap: 8px;
            padding-top: 15px;
            border-top: 1px solid var(--border-color);
        }

        .copy-btn { border-color: #1b5e20; color: #4caf50; flex: 3; }
        .copy-btn:hover { background-color: #1b5e20; color: #fff; }
        
        .clear-btn { border-color: #b71c1c; color: #ef5350; flex: 1; }
        .clear-btn:hover { background-color: #b71c1c; color: #fff; }

        .stats {
            margin-top: 15px;
            font-size: 11px;
            color: #444;
            text-align: left;
            text-transform: uppercase;
        }

        .count { color: #666; margin-left: 4px; margin-right: 10px; }
    </style>
</head>
<body>

<div class="container">
    <button class="new-tab-btn" onclick="window.open(window.location.href, '_blank')">+ Tab</button>
    <button class="expand-btn" onclick="toggleHeight()">↕ Expand</button>
    
    <div id="textInput" class="editor" contenteditable="true" data-placeholder="READY FOR INPUT..."></div>
    
    <div class="controls">
        <button onclick="sentenceCase()">Sentence</button>
        <button class="case-btn-lower" onclick="lowerCase()">lower</button>
        <button class="case-btn-upper" onclick="upperCase()">UPPER</button>
        <button onclick="capitalizedCase()">Capitalized</button>
        <button onclick="alternatingCase()">aLtErNaTe</button>
        <button onclick="titleCase()">Title</button>
        <button onclick="inverseCase()">InVeRsE</button>
    </div>

    <div class="action-btns">
        <button class="copy-btn" onclick="copyText()">📋 Copy</button>
        <button class="clear-btn" onclick="clearText()">🗑️ Clear</button>
    </div>

    <div class="stats">
        CHARS:<span id="charCount" class="count">0</span>
        WORDS:<span id="wordCount" class="count">0</span>
        LINES:<span id="lineCount" class="count">0</span>
    </div>
</div>

<script type="module">
    import { CodeJar } from './codejar.min.js';

    const editorElement = document.getElementById('textInput');
    const counters = {
        char: document.getElementById('charCount'),
        word: document.getElementById('wordCount'),
        line: document.getElementById('lineCount')
    };

    // Initialize CodeJar with tab spacing (4 spaces)
    const jar = CodeJar(editorElement, () => {}, {
        tab: '    '
    });

    jar.onUpdate(updateStats);

    window.toggleHeight = function() {
        if (editorElement.style.height === "800px") {
            editorElement.style.height = "450px";
        } else {
            editorElement.style.height = "800px";
        }
    };

    function updateStats() {
        const val = jar.toString();
        counters.char.innerText = val.length;
        counters.word.innerText = val.trim() ? val.trim().split(/\s+/).length : 0;
        counters.line.innerText = val ? val.split(/\n/).length : 0;
    }

    function transformText(fn) {
        const currentText = jar.toString();
        jar.updateCode(fn(currentText));
        updateStats();
    }

    window.sentenceCase = () => transformText(text => 
        text.toLowerCase().replace(/(^\s*\w|[\.\!\?]\s*\w|\n\s*\w)/g, c => c.toUpperCase())
    );

    window.lowerCase = () => transformText(text => text.toLowerCase());
    window.upperCase = () => transformText(text => text.toUpperCase());
    window.capitalizedCase = () => transformText(text => text.toLowerCase().replace(/\b\w/g, l => l.toUpperCase()));
    window.alternatingCase = () => transformText(text => text.split("").map((c, i) => i % 2 === 0 ? c.toUpperCase() : c.toLowerCase()).join(""));
    window.titleCase = () => transformText(text => text.toLowerCase().replace(/\b\w/g, l => l.toUpperCase()));
    window.inverseCase = () => transformText(text => text.split("").map(c => c === c.toUpperCase() ? c.toLowerCase() : c.toUpperCase()).join(""));

    window.copyText = async function() {
        try {
            await navigator.clipboard.writeText(jar.toString());
            const btn = document.querySelector('.copy-btn');
            btn.innerText = "COPIED";
            setTimeout(() => btn.innerText = "📋 Copy", 1000);
        } catch (err) {}
    };

    window.clearText = function() {
        jar.updateCode("");
        updateStats();
        editorElement.focus();
    };
</script>

</body>
</html>

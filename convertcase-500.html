<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>convertcase</title>
    <style>
        :root {
            --bg-color: #0a0a0a;
            --container-bg: #121212;
            --text-color: #b0b0b0;
            --border-color: #222;
            --accent-color: #8a2be2;
            --input-bg: #0e0e0e;
        }

        body {
            font-family: 'Consolas', 'Monaco', 'Segoe UI', monospace;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            padding: 20px;
            margin: 0;
        }

        .container {
            width: 100%;
            max-width: 1000px;
            background: var(--container-bg);
            padding: 1.5rem;
            border-radius: 4px;
            border: 1px solid var(--border-color);
            position: relative;
            transition: all 0.3s ease;
        }

        /* Styles applied when expanded */
        .container.expanded {
            max-width: 100%;
            min-height: 90vh;
        }

        .new-tab-btn {
            position: absolute;
            top: 10px;
            left: 10px;
            padding: 4px 8px;
            font-size: 10px;
            background: transparent;
            border: 1px solid var(--border-color);
            color: #444;
            cursor: pointer;
            text-transform: uppercase;
        }
        
        .new-tab-btn:hover {
            color: var(--accent-color);
            border-color: var(--accent-color);
        }

        .expand-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            padding: 4px 8px;
            font-size: 10px;
            background: transparent;
            border: 1px solid var(--border-color);
            color: #444;
            cursor: pointer;
            text-transform: uppercase;
        }

        .expand-btn:hover {
            color: var(--accent-color);
            border-color: var(--accent-color);
        }
    </style>
</head>
<body>

    <div class="container">
        <button class="new-tab-btn">New Tab</button>
        <button class="expand-btn">Expand</button>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const container = document.querySelector('.container');
            
            // Check viewport height on load
            if (window.innerHeight > 800) {
                container.classList.add('expanded');
            } else {
                container.classList.remove('expanded');
            }
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>convertcase</title>
    <style>
        :root {
            --bg-color: #0a0a0a;
            --container-bg: #121212;
            --text-color: #b0b0b0;
            --border-color: #222;
            --accent-color: #8a2be2;
            --input-bg: #0e0e0e;
        }

        body {
            font-family: 'Consolas', 'Monaco', 'Segoe UI', monospace;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            padding: 20px;
            margin: 0;
        }

        .container {
            width: 100%;
            max-width: 1000px;
            background: var(--container-bg);
            padding: 1.5rem;
            border-radius: 4px;
            border: 1px solid var(--border-color);
            position: relative;
        }

        .new-tab-btn {
            position: absolute;
            top: 10px;
            left: 10px;
            padding: 4px 8px;
            font-size: 10px;
            background: transparent;
            border: 1px solid var(--border-color);
            color: #444;
            cursor: pointer;
            text-transform: uppercase;
        }
        
        .new-tab-btn:hover {
            color: var(--accent-color);
            border-color: var(--accent-color);
        }

        .expand-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            padding: 4px 8px;
            font-size: 10px;
            background: transparent;
            border: 1px solid var(--border-color);
            color: #444;
            cursor: pointer;
            text-transform: uppercase;
        }

        .expand-btn:hover {
            color: var(--accent-color);
            border-color: var(--accent-color);
        }

        textarea {
            width: 100%;
            height: 450px;
            padding: 20px;
            background-color: var(--input-bg);
            color: #dcdcdc;
            border: 1px solid var(--border-color);
            border-radius: 2px;
            font-size: 16px;
            line-height: 1.1;
            resize: vertical;
            box-sizing: border-box;
            margin-top: 15px;
            margin-bottom: 1.2rem;
            outline: none;
            transition: border-color 0.2s, height 0.2s;
        }

        textarea:focus { border-color: #444; }

        .controls {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 8px;
            margin-bottom: 1rem;
        }

        button {
            padding: 10px;
            cursor: pointer;
            background-color: #1a1a1a;
            color: var(--text-color);
            border: 1px solid var(--border-color);
            border-radius: 2px;
            font-size: 12px;
            letter-spacing: 1px;
            transition: all 0.15s;
        }

        button:hover {
            background-color: var(--accent-color);
            color: #fff;
            border-color: var(--accent-color);
        }

        .case-btn-lower { text-transform: lowercase; }
        .case-btn-upper { text-transform: uppercase; }

        /* Invisible placeholder to reserve the grid slot under Capitalized */
        .empty-space {
            visibility: hidden;
            pointer-events: none;
        }

        .copy-btn { border-color: #1b5e20; color: #4caf50; }
        .copy-btn:hover { background-color: #1b5e20; color: #fff; }

        .download-btn { border-color: #0d47a1; color: #42a5f5; }
        .download-btn:hover { background-color: #0d47a1; color: #fff; }
        
        .clear-btn { border-color: #b71c1c; color: #ef5350; }
        .clear-btn:hover { background-color: #b71c1c; color: #fff; }

        .stats {
            margin-top: 15px;
            font-size: 11px;
            color: #444;
            text-align: left;
            text-transform: uppercase;
            border-top: 1px solid var(--border-color);
            padding-top: 15px;
        }

        .count { color: #666; margin-left: 4px; margin-right: 10px; }
    </style>
</head>
<body>

<div class="container">
    <button class="new-tab-btn" onclick="window.open(window.location.href, '_blank')">+ Tab</button>
    <button class="expand-btn" onclick="toggleHeight()">↕ Expand</button>
    
    <textarea id="textInput" placeholder="READY FOR INPUT..."></textarea>
    
    <div class="controls">
        <!-- Row 1 -->
        <button onclick="sentenceCase()">Sentence</button>
        <button class="case-btn-lower" onclick="lowerCase()">lower</button>
        <button class="case-btn-upper" onclick="upperCase()">UPPER</button>
        <button onclick="capitalizedCase()">Capitalized</button>
        <button onclick="alternatingCase()">aLtErNaTe</button>
        <button onclick="titleCase()">Title</button>
        <button onclick="inverseCase()">InVeRsE</button>
        
        <!-- Row 2 (with 1 blank space below Capitalized, pushing action buttons to the right) -->
        <button onclick="sortLines()">Sort Lines</button>
        <button onclick="trimLines()">Trim Lines</button>
        <button onclick="removeBlankLines()">No Blank Lines</button>
        <div class="empty-space"></div>
        <button class="copy-btn" onclick="copyText()">📋 Copy</button>
        <button class="download-btn" onclick="downloadText()">💾 Save</button>
        <button class="clear-btn" onclick="clearText()">🗑️ Clear</button>
    </div>

    <div class="stats">
        CHARS:<span id="charCount" class="count">0</span>
        WORDS:<span id="wordCount" class="count">0</span>
        LINES:<span id="lineCount" class="count">0</span>
    </div>
</div>

<script>
    const area = document.getElementById('textInput');
    const counters = {
        char: document.getElementById('charCount'),
        word: document.getElementById('wordCount'),
        line: document.getElementById('lineCount')
    };

    if (window.innerHeight > 800) {
        area.style.height = "850px";
    }

    area.addEventListener('input', updateStats);
    
    area.addEventListener('keydown', function(e) {
        if (e.key === 'Tab') {
            e.preventDefault();
            const start = this.selectionStart;
            const end = this.selectionEnd;

            this.value = this.value.substring(0, start) + "\t" + this.value.substring(end);
            this.selectionStart = this.selectionEnd = start + 1;
            updateStats();
        }
    });

    function toggleHeight() {
        if (area.style.height === "800px") {
            area.style.height = "450px";
        } else {
            area.style.height = "800px";
        }
    }

    function updateStats() {
        const val = area.value;
        counters.char.innerText = val.length;
        counters.word.innerText = val.trim() ? val.trim().split(/\s+/).length : 0;
        counters.line.innerText = val ? val.split(/\n/).length : 0;
    }

    function sentenceCase() {
        let text = area.value.toLowerCase();
        area.value = text.replace(/(^\s*\w|[\.\!\?]\s*\w|\n\s*\w)/g, c => c.toUpperCase());
        updateStats();
    }

    function lowerCase() {
        area.value = area.value.toLowerCase();
        updateStats();
    }

    function upperCase() {
        area.value = area.value.toUpperCase();
        updateStats();
    }

    function capitalizedCase() {
        area.value = area.value.toLowerCase().replace(/\b\w/g, l => l.toUpperCase());
        updateStats();
    }

    function alternatingCase() {
        area.value = area.value.split("").map((c, i) => i % 2 === 0 ? c.toUpperCase() : c.toLowerCase()).join("");
        updateStats();
    }

    function titleCase() {
        area.value = area.value.toLowerCase().replace(/\b\w/g, l => l.toUpperCase());
        updateStats();
    }

    function inverseCase() {
        area.value = area.value.split("").map(c => 
            c === c.toUpperCase() ? c.toLowerCase() : c.toUpperCase()
        ).join("");
        updateStats();
    }

    function sortLines() {
        if (!area.value) return;
        area.value = area.value.split("\n").sort().join("\n");
        updateStats();
    }

    function trimLines() {
        if (!area.value) return;
        area.value = area.value.split("\n").map(line => line.trim()).join("\n");
        updateStats();
    }

    function removeBlankLines() {
        if (!area.value) return;
        area.value = area.value.split("\n").filter(line => line.trim() !== "").join("\n");
        updateStats();
    }

    async function copyText() {
        try {
            await navigator.clipboard.writeText(area.value);
            const btn = document.querySelector('.copy-btn');
            btn.innerText = "COPIED";
            setTimeout(() => btn.innerText = "📋 Copy", 1000);
        } catch (err) {}
    }

    function downloadText() {
        const blob = new Blob([area.value], { type: 'text/plain;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'document.txt';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
    }

    function clearText() {
        area.value = "";
        updateStats();
        area.focus();
    }
</script>

</body>
</html>
